{% extends "base.html" %}
{% block title %}Ingresar — Millas & Viñas{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h3>Iniciar sesión</h3>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="field">
          <label for="dni">DNI</label>
          <input type="text" id="dni" name="dni" required maxlength="15" autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <p class="form-foot">¿Todavía no tenés cuenta? <a href="{{ url_for('registro') }}">Registrate</a></p>
    </div>
  </div>
</section>
{% endblock %}

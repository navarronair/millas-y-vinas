{% extends "base.html" %}
{% block title %}Concierge — Millas & Viñas{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/concierge.css') }}">

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2>Concierge</h2>
      <span class="tag">recomendaciones a medida</span>
    </div>

    <div class="concierge-wrap">
      <div class="concierge-panel">

        <div class="concierge-header">
          <h3>Concierge de Millas</h3>
          <p>Recomendaciones de vinoteca y de beneficios de viaje según tu categoría.</p>
        </div>

        <div class="concierge-profile" id="c-profile"></div>

        <div class="concierge-chat" id="c-chat"></div>

        <div class="concierge-quick">
          <button data-q="sugerime algo">Sugerime algo</button>
          <button data-q="vino tinto">Vino tinto</button>
          <button data-q="upgrade de vuelo">Upgrade de vuelo</button>
          <button data-q="sala vip">Sala VIP</button>
          <button data-q="regalo">Regalos</button>
        </div>

        <div class="concierge-composer">
          <input id="c-input" type="text" placeholder="Escribí tu consulta..." autocomplete="off">
          <button id="c-send">Enviar</button>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
  // Datos reales del cliente logueado y del catálogo de vinoteca,
  // inyectados por Flask (misma consulta que usa /beneficios).
  window.CLIENTE_ACTUAL = {{ cliente|tojson }};
  window.CATALOGO_VINOS = {{ vinos|tojson }};
</script>
<script src="{{ url_for('static', filename='js/concierge.js') }}"></script>
{% endblock %}

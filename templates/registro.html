{% extends "base.html" %}
{% block title %}Crear cuenta — Millas & Viñas{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card">
      <h3>Crear tu cuenta</h3>
      <p style="font-size:0.9rem;color:var(--ink-soft);margin-bottom:26px;">
        Empezás en categoría Bronze. Cada pasaje que reserves suma millas y te
        acerca al siguiente nivel de Beneficios.
      </p>
      <form method="POST" action="{{ url_for('registro') }}">
        <div class="field">
          <label for="dni">DNI</label>
          <input type="text" id="dni" name="dni" required maxlength="15">
        </div>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required maxlength="60">
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required maxlength="60">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="120">
        </div>
        <div class="field">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="text" id="telefono" name="telefono" maxlength="30">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
      </form>
      <p class="form-foot">¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciá sesión</a></p>
    </div>
  </div>
</section>
{% endblock %}
